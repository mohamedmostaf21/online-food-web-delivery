services:
  # Backend Service Configuration
  backend:
    build: ./backend
    container_name: online_food_backend
    ports:
      - "5000:5000"  # Maps port 5000 of your machine to port 5000 of the container
    environment:
      - NODE_ENV=development
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/online_food}
    networks:
      - food_network
    depends_on:
      - mongo
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json

  # Frontend Service Configuration
  frontend:
    build: ./frontend/my-react-app
    container_name: online_food_frontend
    ports:
      - "5173:5173"  # Maps port 5173 of your machine to port 5173 of the container
    environment:
      - CHOKIDAR_USEPOLLING=true  # Helps React hot-reload work smoothly inside Docker containers
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend  # Ensures the backend spins up before the frontend starts
    networks:
      - food_network
    develop:
      watch:
        - action: sync
          path: ./frontend/my-react-app
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/my-react-app/package.json

  # MongoDB Service
  mongo:
    image: mongo:7
    container_name: online_food_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: online_food
    networks:
      - food_network

networks:
  food_network:
    driver: bridge

volumes:
  mongo_data:
